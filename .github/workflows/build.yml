name: Build

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "**.md"
      - "LICENSE"
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # 构建矩阵来自仓库的单一版本清单 versions.json，不再在 workflow 里硬编码节点
  prepare:
    name: Prepare matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build matrix from versions.json
        id: matrix
        run: |
          set -euo pipefail
          matrix="$(python3 tools/versions.py matrix)"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          printf 'matrix = %s\n' "$matrix"

  build:
    name: ${{ matrix.node }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      # 一个节点失败时不取消其它节点，便于一次性看清全部问题
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # 编译工具链：1.21.x 用 21，26.x 用 25（versions.json 的 java 字段）
      - name: Set up JDK ${{ matrix.java }} (compile toolchain)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      # 构建 JVM：Loom 1.18+ 要求 Gradle 自身跑在 Java 25 上。
      # 放在最后一步，使 JAVA_HOME 指向 25；上面的 JDK 通过
      # JAVA_HOME_<ver>_<arch> 环境变量暴露，Gradle 依此发现工具链
      # （见仓库 gradle.properties 的 org.gradle.java.installations.fromEnv）。
      - name: Set up JDK 25 (Gradle JVM)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # PR 只读缓存，避免用未合并的依赖污染 main 的缓存
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Build
        run: ./gradlew ${{ matrix.node }}:build --stacktrace

      - name: Upload jars
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.node }}
          path: |
            versions/${{ matrix.node }}/build/libs/*.jar
            !versions/${{ matrix.node }}/build/libs/*-sources.jar
            !versions/${{ matrix.node }}/build/libs/*-dev.jar
          if-no-files-found: error
          retention-days: 14
