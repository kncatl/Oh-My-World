name: Build

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "**.md"
      - "LICENSE"
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      # 一个加载器失败时不取消其它两个，便于一次性看清全部问题
      fail-fast: false
      matrix:
        # Stonecutter 节点，产物为 oh-my-world-<mc>-<loader>-<mod_version>.jar
        node:
          - 1.21.1-neoforge
          - 1.21.11-neoforge
          - 1.21.11-fabric

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # PR 只读缓存，避免用未合并的依赖污染 main 的缓存
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Build
        run: ./gradlew ${{ matrix.node }}:build --stacktrace

      - name: Upload jars
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.node }}
          path: |
            versions/${{ matrix.node }}/build/libs/*.jar
            !versions/${{ matrix.node }}/build/libs/*-sources.jar
            !versions/${{ matrix.node }}/build/libs/*-dev.jar
          if-no-files-found: error
          retention-days: 14
