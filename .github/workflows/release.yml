name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # 1) 校验 tag 与 mod_version 一致；2) 从单一版本清单生成构建矩阵
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify tag matches mod_version
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mod_version="$(sed -n 's/^mod_version=//p' gradle.properties | tr -d '\r' | head -1)"
          if [ "$version" != "$mod_version" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match mod_version=${mod_version} in gradle.properties"
            exit 1
          fi
          echo "Releasing ${GITHUB_REF_NAME}"

      - name: Build matrix from versions.json
        id: matrix
        run: |
          set -euo pipefail
          matrix="$(python3 tools/versions.py matrix)"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          printf 'matrix = %s\n' "$matrix"

  build:
    name: ${{ matrix.node }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # 编译工具链：1.21.x 用 21，26.x 用 25（versions.json 的 java 字段）
      - name: Set up JDK ${{ matrix.java }} (compile toolchain)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      # 构建 JVM：Loom 1.18+ 要求 Gradle 自身跑在 Java 25 上。
      # 放在最后一步，使 JAVA_HOME 指向 25；上面的 JDK 通过
      # JAVA_HOME_<ver>_<arch> 环境变量暴露，Gradle 依此发现工具链
      # （见仓库 gradle.properties 的 org.gradle.java.installations.fromEnv）。
      - name: Set up JDK 25 (Gradle JVM)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build
        run: ./gradlew ${{ matrix.node }}:build --stacktrace

      - name: Upload jars
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.node }}
          path: |
            versions/${{ matrix.node }}/build/libs/*.jar
            !versions/${{ matrix.node }}/build/libs/*-sources.jar
            !versions/${{ matrix.node }}/build/libs/*-dev.jar
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download jars
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Prepare release notes
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          printf '## %s\n\n' "$tag" > dist/RELEASE_NOTES.md
          printf '| Minecraft | Loader | File |\n| --- | --- | --- |\n' >> dist/RELEASE_NOTES.md
          # 每个 jar 一行；MC 列显示 versions.json 里声明的覆盖范围（mcRange，只写验证过的范围）
          for jar in $(ls dist/*.jar | sort -V); do
            name="$(basename "$jar")"
            mc="$(printf '%s' "$name" | sed -E 's/^oh-my-world-(.+)-(neoforge|fabric|forge|quilt)-.*$/\1/')"
            raw_loader="$(printf '%s' "$name" | sed -E 's/^oh-my-world-(.+)-(neoforge|fabric|forge|quilt)-.*$/\2/')"
            case "$raw_loader" in
              neoforge) loader="NeoForge" ;;
              fabric)   loader="Fabric" ;;
              forge)    loader="Forge" ;;
              quilt)    loader="Quilt" ;;
              *)        loader="$raw_loader" ;;
            esac
            mc_range="$(python3 tools/versions.py range "$mc" "$raw_loader")"
            printf '| %s | %s | `%s` |\n' "$mc_range" "$loader" "$name" >> dist/RELEASE_NOTES.md
          done
          javas="$(python3 tools/versions.py javas)"
          printf '\nRequires **Java %s**.\n' "$javas" >> dist/RELEASE_NOTES.md

          # 从 CHANGELOG 中截取该 tag 对应的小节
          extract() {
            [[ -f "$1" ]] || return 0
            awk -v tag="$2" '
              $0 ~ "^##[[:space:]]+" tag "[[:space:]]*$" { found = 1; next }
              found && /^##[[:space:]]/ { exit }
              found { print }
            ' "$1"
          }

          en="$(extract CHANGELOG.md "$tag")"
          if [ -n "$en" ]; then
            printf '\n### What changed\n%s\n' "$en" >> dist/RELEASE_NOTES.md
          fi

          zh="$(extract CHANGELOG_zh_cn.md "$tag")"
          if [ -n "$zh" ]; then
            printf '\n---\n\n### 中文更新日志\n%s\n' "$zh" >> dist/RELEASE_NOTES.md
          fi

          echo "----- release notes -----"
          cat dist/RELEASE_NOTES.md
          echo "----- assets -----"
          ls -l dist/*.jar

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          title="Oh-My-World ${tag}"
          # 预发布后缀（如 v1.2.0-beta.1）：发布为 Pre-release，不会被标记成 Latest
          prerelease=""
          case "$tag" in
            *-*) prerelease="--prerelease" ;;
          esac

          if gh release view "$tag" >/dev/null 2>&1; then
            # 允许重跑：已存在则更新说明并覆盖附件
            echo "Release $tag already exists, updating"
            gh release upload "$tag" dist/*.jar --clobber
            gh release edit "$tag" --title "$title" --notes-file dist/RELEASE_NOTES.md $prerelease
          else
            gh release create "$tag" dist/*.jar \
              --title "$title" \
              --notes-file dist/RELEASE_NOTES.md \
              --verify-tag \
              $prerelease
          fi
