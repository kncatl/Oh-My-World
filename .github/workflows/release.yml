name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        node:
          - 1.21.1-neoforge
          - 1.21.11-neoforge
          - 1.21.11-fabric

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify tag matches mod_version
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mod_version="$(sed -n 's/^mod_version=//p' gradle.properties | tr -d '\r' | head -1)"
          if [ "$version" != "$mod_version" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match mod_version=${mod_version} in gradle.properties"
            exit 1
          fi
          echo "Releasing ${GITHUB_REF_NAME}"

      - name: Build
        run: ./gradlew ${{ matrix.node }}:build --stacktrace

      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.node }}
          path: |
            versions/${{ matrix.node }}/build/libs/*.jar
            !versions/${{ matrix.node }}/build/libs/*-sources.jar
            !versions/${{ matrix.node }}/build/libs/*-dev.jar
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download jars
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Prepare release notes
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"

          # 从 CHANGELOG 中截取该 tag 对应的小节
          extract() {
            [[ -f "$1" ]] || return 0
            awk -v tag="$2" '
              $0 ~ "^##[[:space:]]+" tag "[[:space:]]*$" { found = 1; next }
              found && /^##[[:space:]]/ { exit }
              found { print }
            ' "$1"
          }

          : > dist/RELEASE_NOTES.md
          extract CHANGELOG.md "$tag" >> dist/RELEASE_NOTES.md

          zh="$(extract CHANGELOG_zh_cn.md "$tag")"
          if [ -n "$zh" ]; then
            printf '\n---\n\n### 中文更新日志\n\n%s\n' "$zh" >> dist/RELEASE_NOTES.md
          fi

          if [ ! -s dist/RELEASE_NOTES.md ]; then
            printf 'Release %s\n' "$tag" > dist/RELEASE_NOTES.md
          fi

          echo "----- release notes -----"
          cat dist/RELEASE_NOTES.md
          echo "----- assets -----"
          ls -l dist/*.jar

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" dist/*.jar \
            --title "${GITHUB_REF_NAME}" \
            --notes-file dist/RELEASE_NOTES.md \
            --verify-tag
