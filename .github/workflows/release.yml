name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        node:
          - 1.21.1-neoforge
          - 1.21.11-neoforge
          - 1.21.11-fabric

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify tag matches mod_version
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mod_version="$(sed -n 's/^mod_version=//p' gradle.properties | tr -d '\r' | head -1)"
          if [ "$version" != "$mod_version" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match mod_version=${mod_version} in gradle.properties"
            exit 1
          fi
          echo "Releasing ${GITHUB_REF_NAME}"

      - name: Build
        run: ./gradlew ${{ matrix.node }}:build --stacktrace

      - name: Upload jars
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.node }}
          path: |
            versions/${{ matrix.node }}/build/libs/*.jar
            !versions/${{ matrix.node }}/build/libs/*-sources.jar
            !versions/${{ matrix.node }}/build/libs/*-dev.jar
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download jars
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Prepare release notes
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          printf '## %s\n\n' "$tag" > dist/RELEASE_NOTES.md
          printf '| Minecraft | Loader | File |\n| --- | --- | --- |\n' >> dist/RELEASE_NOTES.md
          for jar in dist/*.jar; do
            name="$(basename "$jar")"
            mc="$(printf '%s' "$name" | sed -E 's/^oh-my-world-(.+)-(neoforge|fabric|forge|quilt)-.*$/\1/')"
            loader="$(printf '%s' "$name" | sed -E 's/^oh-my-world-(.+)-(neoforge|fabric|forge|quilt)-.*$/\2/')"
            loader="$(printf '%s' "$loader" | sed -E 's/^(.)/\U\1/')"
            printf '| %s | %s | `%s` |\n' "$mc" "$loader" "$name" >> dist/RELEASE_NOTES.md
          done
          printf '\nRequires **Java 21**.\n' >> dist/RELEASE_NOTES.md

          # 从 CHANGELOG 中截取该 tag 对应的小节
          extract() {
            [[ -f "$1" ]] || return 0
            awk -v tag="$2" '
              $0 ~ "^##[[:space:]]+" tag "[[:space:]]*$" { found = 1; next }
              found && /^##[[:space:]]/ { exit }
              found { print }
            ' "$1"
          }

          en="$(extract CHANGELOG.md "$tag")"
          if [ -n "$en" ]; then
            printf '\n### What changed\n%s\n' "$en" >> dist/RELEASE_NOTES.md
          fi

          zh="$(extract CHANGELOG_zh_cn.md "$tag")"
          if [ -n "$zh" ]; then
            printf '\n---\n\n### 中文更新日志\n%s\n' "$zh" >> dist/RELEASE_NOTES.md
          fi

          echo "----- release notes -----"
          cat dist/RELEASE_NOTES.md
          echo "----- assets -----"
          ls -l dist/*.jar

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          title="Oh-My-World ${tag}"

          if gh release view "$tag" >/dev/null 2>&1; then
            # 允许重跑：已存在则更新说明并覆盖附件
            echo "Release $tag already exists, updating"
            gh release upload "$tag" dist/*.jar --clobber
            gh release edit "$tag" --title "$title" --notes-file dist/RELEASE_NOTES.md
          else
            gh release create "$tag" dist/*.jar \
              --title "$title" \
              --notes-file dist/RELEASE_NOTES.md \
              --verify-tag
          fi
